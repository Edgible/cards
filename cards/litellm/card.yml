apiVersion: v1
kind: Card
metadata:
  name: litellm
  description: Metered model API and its admin, one LiteLLM process

applications:
  - name: litellm
    what: LiteLLM admin
    from: docker.litellm.ai/berriai/litellm:main-stable
    database: postgres:16
    port: 4000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: lab

  - name: litellm-api
    what: LiteLLM proxy, same process as litellm
    from: docker.litellm.ai/berriai/litellm:main-stable
    port: 4000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: lab
