# Model the gateway exposes. Ollama is on the Compose network and has no host port.
# The price is not zero, so a team budget can stop this local model.
# A price of zero never trips a dollar budget.

model_list:
  - model_name: qwen2.5
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001

litellm_settings:
  drop_params: true
