apiVersion: v1
kind: Card
metadata:
  name: website
  description: Public site, open tracker, locked dashboard, locked monitor

applications:
  - name: site
    what: your static files, served by nginx
    from: nginx:alpine
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: web
    resources:
      compose: https://raw.githubusercontent.com/Edgible/cards/main/cards/website/docker-compose.yml
      files:
        - https://raw.githubusercontent.com/Edgible/cards/main/cards/website/public/index.html

  - name: analytics
    what: Umami tracking script, same process as umami
    from: ghcr.io/umami-software/umami:latest
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: web
    resources:
      compose: https://raw.githubusercontent.com/umami-software/umami/master/docker-compose.yml
      changes:
        - Bind the host port to 127.0.0.1 only
        - Replace the sample database password, APP_SECRET, and TWO_FACTOR_ENCRYPTION_KEY with generated values
      env: [POSTGRES_PASSWORD, APP_SECRET, TWO_FACTOR_ENCRYPTION_KEY]

  - name: umami
    what: Umami dashboard
    from: ghcr.io/umami-software/umami:latest
    database: postgres:15-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: web
    resources:
      compose: https://raw.githubusercontent.com/umami-software/umami/master/docker-compose.yml
      changes:
        - Bind the host port to 127.0.0.1 only
        - Replace the sample database password, APP_SECRET, and TWO_FACTOR_ENCRYPTION_KEY with generated values
      env: [POSTGRES_PASSWORD, APP_SECRET, TWO_FACTOR_ENCRYPTION_KEY]

  - name: status
    what: Uptime Kuma
    from: louislam/uptime-kuma:2
    port: 3001
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: monitor
    resources:
      compose: https://raw.githubusercontent.com/louislam/uptime-kuma/master/compose.yaml
      changes:
        - Bind the host port to 127.0.0.1 only
