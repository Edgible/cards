apiVersion: v1
kind: Card
metadata:
  name: website
  description: Public site, open tracker, locked dashboard, locked monitor

applications:
  - name: site
    what: your static files, served by nginx
    from: nginx:alpine
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: web

  - name: analytics
    what: Umami tracking script, same process as umami
    from: ghcr.io/umami-software/umami:latest
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: web

  - name: umami
    what: Umami dashboard
    from: ghcr.io/umami-software/umami:latest
    database: postgres:15-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: web

  - name: status
    what: Uptime Kuma
    from: louislam/uptime-kuma:2
    port: 3001
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: monitor
