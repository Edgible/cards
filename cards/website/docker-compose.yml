# Site Compose file for the website card.
# The host port comes from card.env. Start with:
#   docker compose --project-name site --env-file card.env -f docker-compose.yml up -d

services:
  site:
    image: nginx:alpine
    container_name: site
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:?set SITE_PORT in card.env}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
