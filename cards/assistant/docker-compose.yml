# Author-supplied Compose file for the assistant card.
# Ports come from card.env. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d

services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${OLLAMA_PORT:?set OLLAMA_PORT in card.env}:11434"

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:?set ASSISTANT_PORT in card.env}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
