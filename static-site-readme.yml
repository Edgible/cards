why: >-
  A static site, such as a project's docs, a catalog, or a small business's pages built by a site
  generator, is usually handed to a hosting service: GitHub Pages, Netlify, Cloudflare Pages, or
  an S3 bucket. This card serves it from a machine you own instead, through Edgible, and keeps it
  up to date from wherever the site is built, with no hosting account and no inbound port.
  [Caddy](https://caddyserver.com) serves the files.
what: >-
  One app, `static-site`, on `none`, because a public site is for anyone. Two containers run it.
  `static-site-sync` downloads the site as a `.tar.gz` from `STATIC_SITE_SOURCE` every
  `STATIC_SITE_EVERY` seconds, and puts a new version live only when it downloaded in full,
  changed, has no paths that reach outside its folder, and has an `index.html` at its top. Going
  live is one rename, so a visitor never sees half a site, and anything wrong leaves the live site
  as it is. It runs as its image's own user, not root. `static-site` is Caddy on port `8080`,
  serving that copy read-only, with its admin API off and no certificate of its own: Edgible gives
  the site its hostname and HTTPS. A page the site does not have gets the site's own `404.html`
  when it has one. The source can be any URL that serves a `.tar.gz`: a branch archive from
  GitHub, GitLab, or your own Gitea, or a file on any web server. Build the site wherever you
  like, such as in CI, and publish the build to that branch or URL.
data: >-
  The live version and the one before it live in the volume `static-site-www`. Nothing in it
  needs a backup: the source has the site.
edit: >-
  Set `DEVICE` to a name `edgible device list` prints, and `STATIC_SITE_SOURCE` to the URL of the
  site's `.tar.gz`. Keep `STATIC_SITE_STRIP=1` for a Git host's branch archive, which puts
  everything in one top folder, and set it to `0` for a tarball made from inside the site's
  folder. Change `STATIC_SITE_PORT` only if 8080 is taken.
start: >-
  Here that means the first copy of the site is in place and Caddy serves it, so it fails
  when the source cannot be downloaded or has no `index.html` at its top. Then
  `docker compose --env-file static-site/card.env -f static-site/docker-compose.yml logs static-site-sync`
  says why.
verify:
  static-site: >-
    A new version of the site goes live within `STATIC_SITE_EVERY` seconds of reaching the
    source, and the sync container logs `live:` with its hash. To serve the site on your own
    domain, publish with `--hostnames`, and point that name at Edgible as its docs say.
docs: [Caddy file server, https://caddyserver.com/docs/caddyfile/directives/file_server]
