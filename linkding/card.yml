apiVersion: v1
kind: Card
metadata:
  name: linkding
  description: linkding, a minimal bookmark manager, for your browsers and its extension
  type: app

applications:
  - name: linkding
    what: linkding, for the web and the browser extension
    from: ghcr.io/sissbruecker/linkding:1.47.0
    port: 9090
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: linkding

places:
  linkding:
    memory: 384 MB
    disk: 1.5 GB
    arch: [amd64, arm64, arm]
    gpu: none
