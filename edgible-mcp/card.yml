apiVersion: v1
kind: Card
metadata:
  name: edgible-mcp
  description: Read-only Edgible tools for Claude and other assistants, published with mcp-bridge
  type: app

applications:
  - name: edgible-mcp
    what: Edgible MCP tools over Streamable HTTP
    from: ghcr.io/edgible-org/edgible-mcp:0.4.0
    port: 8000
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: edgible-mcp

places:
  edgible-mcp:
    memory: 384 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
