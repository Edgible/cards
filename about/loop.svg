<svg class="loop-art" viewBox="55 10 901 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title">
<title id="loop-title">The cards loop: someone gets a setup working and writes it down as a card, it is tested on a real machine, someone else runs it, makes it their own, and shares it back to the cards everyone draws from</title>
