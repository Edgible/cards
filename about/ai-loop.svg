<svg class="ai-art" viewBox="20 30 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-title">
<title id="ai-title">With an AI agent: you describe a need, the agent suggests options from the cards. If a card fits, you pick it and the agent deploys it on your machine. If none fits, the agent builds a new card with you, tests and deploys it, and you share it back, so the next person finds it.</title>
<style>
.ai-art{--a-ink:#000033;--a-muted:#4a4f66;--a-mid:#2e4a9e;--a-ring:#e8743b;--a-bg:#f5f6fa}
@media (prefers-color-scheme:dark){.ai-art{--a-ink:#e8eaf4;--a-muted:#a3a8bf;--a-bg:#0d1020}}
.ai-art text{font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<defs><marker id="ai-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a-ring)"/></marker>
<filter id="ai-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000033" flood-opacity=".2"/></filter></defs>
<path d="M137 120 H218" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/>
<path d="M304 120 H384" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/>
<path d="M476 120 H554" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/><text x="514.0" y="106" text-anchor="middle" font-size="18" font-weight="600" fill="var(--a-muted)">yes</text>
<path d="M640 120 H722" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/>
<path d="M808 120 H889" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/>
<g transform="translate(430 120)"><rect x="-32" y="-32" width="64" height="64" rx="8" fill="#fff" stroke="var(--a-ring)" stroke-width="3" transform="rotate(45)" filter="url(#ai-shadow)"/><text x="0" y="8" text-anchor="middle" font-size="24" font-weight="700" fill="#000033">?</text><text x="0" y="-60" text-anchor="middle" font-size="21" fill="var(--a-ink)">Is there a card?</text></g>
<path d="M430 170 V301" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/><text x="442" y="238.5" text-anchor="start" font-size="18" font-weight="600" fill="var(--a-muted)">no</text>
<path d="M472 345 H554" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/>
<path d="M640 345 H722" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/>
<path d="M766 437 C 766 510, 262 510, 262 405" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/><text x="514.0" y="521" text-anchor="middle" font-size="18" font-weight="600" fill="var(--a-muted)">so the next person finds it</text>
<path d="M262 283 V222" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ai-arrow)"/><text x="274" y="265" text-anchor="start" font-size="18" font-weight="600" fill="var(--a-muted)">suggests from</text>
<g transform="translate(262 375)" filter="url(#ai-shadow)"><g transform="rotate(-22)"><rect x="-34" y="-78" width="68" height="92" rx="7" fill="#fff" stroke="#9aa6c8" stroke-width="2"/><rect x="-34" y="-78" width="68" height="16" rx="7" fill="#2e4a9e"/><rect x="-34" y="-68" width="68" height="6" fill="#2e4a9e"/></g><g transform="rotate(22)"><rect x="-34" y="-78" width="68" height="92" rx="7" fill="#fff" stroke="#9aa6c8" stroke-width="2"/><rect x="-34" y="-78" width="68" height="16" rx="7" fill="#1d9a4a"/><rect x="-34" y="-68" width="68" height="6" fill="#1d9a4a"/></g><g transform="rotate(-11)"><rect x="-34" y="-78" width="68" height="92" rx="7" fill="#fff" stroke="#9aa6c8" stroke-width="2"/><rect x="-34" y="-78" width="68" height="16" rx="7" fill="#8a5cf6"/><rect x="-34" y="-68" width="68" height="6" fill="#8a5cf6"/></g><g transform="rotate(11)"><rect x="-34" y="-78" width="68" height="92" rx="7" fill="#fff" stroke="#9aa6c8" stroke-width="2"/><rect x="-34" y="-78" width="68" height="16" rx="7" fill="#e8743b"/><rect x="-34" y="-68" width="68" height="6" fill="#e8743b"/></g><rect x="-34" y="-78" width="68" height="92" rx="7" fill="#fff" stroke="#2e4a9e" stroke-width="2.5"/><rect x="-34" y="-78" width="68" height="16" rx="7" fill="#e8743b"/><rect x="-34" y="-68" width="68" height="6" fill="#e8743b"/><text x="0" y="-26" text-anchor="middle" font-size="17" font-weight="600" fill="#000033">cards</text><path d="M-8 -12 l5 5 l11 -11" fill="none" stroke="#1d9a4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(95 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ai-shadow)"/><path d="M-17 -15 h34 a5 5 0 0 1 5 5 v18 a5 5 0 0 1 -5 5 h-20 l-9 8 v-8 h-5 a5 5 0 0 1 -5 -5 v-18 a5 5 0 0 1 5 -5 z" fill="#fff"/><text x="0" y="5" text-anchor="middle" font-size="20" font-weight="700" fill="var(--a-mid)">?</text><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">You have</tspan><tspan x="0" dy="25">a need</tspan></text></g>
<g transform="translate(262 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ai-shadow)"/><path d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z" fill="#fff"/><path d="M14 -16 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#fff"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Your AI agent</tspan><tspan x="0" dy="25">suggests options</tspan></text></g>
<g transform="translate(598 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ai-shadow)"/><rect x="-15" y="-19" width="30" height="38" rx="4" fill="#fff"/><rect x="-15" y="-19" width="30" height="9" rx="4" fill="#e8743b"/><line x1="-8" y1="0" x2="8" y2="0" stroke="var(--a-mid)" stroke-width="2.5"/><line x1="-8" y1="8" x2="4" y2="8" stroke="var(--a-mid)" stroke-width="2.5"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Pick a card</tspan></text></g>
<g transform="translate(766 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ai-shadow)"/><path d="M-14 6 V14 H14 V6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 8 V-16 M-9 -7 L0 -16 L9 -7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">It deploys</tspan><tspan x="0" dy="25">from the card</tspan></text></g>
<g transform="translate(933 120)"><circle r="34" fill="#1d9a4a" filter="url(#ai-shadow)"/><rect x="-13" y="-17" width="26" height="34" rx="5" fill="#fff"/><path d="M-6 0 l4 5 l9 -10" fill="none" stroke="#1d9a4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Running on</tspan><tspan x="0" dy="25">your machine</tspan></text></g>
<g transform="translate(430 345)"><circle r="34" fill="var(--a-mid)" filter="url(#ai-shadow)"/><rect x="-15" y="-17" width="26" height="34" rx="4" fill="#fff"/><rect x="-15" y="-17" width="26" height="8" rx="4" fill="#e8743b"/><g transform="translate(9 6) rotate(45)"><rect x="-3.5" y="-15" width="7" height="22" rx="1" fill="#fff" stroke="var(--a-mid)" stroke-width="2"/><path d="M-3.5 7 L0 13 L3.5 7 Z" fill="var(--a-mid)"/></g><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">It builds a</tspan><tspan x="0" dy="25">new card with you</tspan></text></g>
<g transform="translate(598 345)"><circle r="34" fill="#1d9a4a" filter="url(#ai-shadow)"/><path d="M-12 1 l8 8 l16 -18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Tested and running</tspan><tspan x="0" dy="25">on your machine</tspan></text></g>
<g transform="translate(766 345)"><circle r="34" fill="var(--a-mid)" filter="url(#ai-shadow)"/><path d="M0 -15 L12 -2 H5 V14 H-5 V-2 H-12 Z" fill="#fff"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Share it back</tspan></text></g>
</svg>