# Grow the cards: each night, an agent makes one new app card for the first gap in the
# skill's needs map, and it is tested on a real serving device. A card that passes becomes
# a pull request for a person to review; one that does not becomes an issue saying how far
# it got. Nothing is ever merged here. See HOW-IT-WORKS.md.
#
# The agent is a Claude Code session with the edgible-cards skill, on the runner's Claude
# subscription. It works in its own home folder with a short list of commands (card-kit's
# tools and Docker image lookups): no shell beyond that, no GitHub or Edgible login. This
# workflow, not the agent, checks the card, tests it, and opens the pull request.
#
# It skips the night when 3 agent-made pull requests are already waiting for review.

name: grow

on:
  # Each night, when the skill evals end (they start the night; see skill-evals.yml).
  workflow_run:
    workflows: [skill-evals]
    types: [completed]
  workflow_dispatch:
    inputs:
      app:
        description: Make a card for this app instead of the next gap (its name on awesome-selfhosted)
        type: string
        default: ""

permissions:
  contents: write        # push the card's branch
  pull-requests: write   # open the pull request
  issues: write          # or the issue

concurrency:
  group: grow
  cancel-in-progress: false

env:
  MAX_OPEN: 3
  ATTEMPTS: 3

defaults:
  run:
    shell: bash

jobs:
  grow:
    # Only the nightly chain continues: a run started by hand does not set off the next job.
    # The workflow before it ran on the schedule, or was itself part of the chain and did not skip.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule' ||
      (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: [self-hosted, edgible-test]
    timeout-minutes: 240
    steps:
      - name: Add merged agent cards to the needs map
        # A merged agent-made card goes into its category's cards: in card-kit's needs map,
        # through a card-kit pull request, so the category stops counting as a gap. This uses
        # the runner's own GitHub sign-in (gh), because this workflow's token reaches only
        # this repo. It runs code from main only, never from a pull request.
        run: |
          set -euo pipefail
          merged=$(GH_TOKEN=${{ github.token }} gh pr list --repo "$GITHUB_REPOSITORY" --label agent-card --state merged --limit 200 \
                   --json title,body --jq '.[] | [(.title | sub("^New app card: "; "")), ((.body | capture("Category: (?<c>[^\n]+)").c) // "")] | @tsv')
          [ -n "$merged" ] || { echo "no merged agent-made cards"; exit 0; }
          rm -rf kit-map && git clone -q --depth 1 https://github.com/Edgible/card-kit.git kit-map
          if gh pr list --repo Edgible/card-kit --state open --search "head:needs-map/agent-cards" --json number --jq length | grep -qv '^0$'; then
            echo "a needs-map pull request is already open"; exit 0
          fi
          printf '%s\n' "$merged" | python3 -c '
          import re, sys
          path = "kit-map/skills/edgible-cards/needs-map.yaml"
          text = open(path).read()
          added = []
          for line in sys.stdin.read().splitlines():
              card, _, category = line.partition("\t")
              if not card or not category:
                  continue
              block = re.search(r"(?ms)^- category: " + re.escape(category) + r"\n.*?(?=^- category:|\Z)", text)
              if not block:
                  print(f"{card}: no category {category} in the needs map"); continue
              m = re.search(r"(?m)^  cards: \[(.*)\]$", block.group(0))
              cards = [c.strip() for c in m.group(1).split(",") if c.strip()]
              if card in cards:
                  continue
              new = block.group(0)[:m.start()] + "  cards: [" + ", ".join(cards + [card]) + "]" + block.group(0)[m.end():]
              text = text[:block.start()] + new + text[block.end():]
              added.append(f"{card} ({category})")
          open(path, "w").write(text)
          open("kit-map/ADDED", "w").write("\n".join(added))
          print("adding:", ", ".join(added) or "nothing")
          '
          [ -s kit-map/ADDED ] || exit 0
          cd kit-map
          branch="needs-map/agent-cards-$(date -u +%F)"
          git checkout -q -b "$branch"
          git add skills/edgible-cards/needs-map.yaml
          git -c user.name="cards grow" -c user.email="actions@github.com" commit -q -m "Needs map: add merged agent-made cards" -m "$(cat ADDED)"
          git push -q origin "$branch"
          gh pr create --repo Edgible/card-kit --base main --head "$branch" --title "Needs map: add merged agent-made cards" \
            --body "Adds app cards merged into Edgible/cards from the nightly grow job to their categories in the needs map, so those categories stop counting as gaps:

          $(sed 's/^/- /' ADDED)

          Made by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Check the review queue and tonight's evals
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          EVALS: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label agent-card --state open --json number --jq length)
          echo "$open agent-made pull requests are waiting for review (at most $MAX_OPEN)"
          # If tonight's skill evals stopped early, such as at the subscription's usage limit,
          # this long session would too: skip tonight.
          # In the nightly chain, the evals that started this run; by hand, today's, if any.
          [ "$GITHUB_EVENT_NAME" = workflow_run ] && evals=$EVALS || \
          evals=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow skill-evals.yml --limit 1 --json conclusion,createdAt \
                  --jq '.[0] | select(.createdAt[0:10] == (now | strftime("%Y-%m-%d"))) | .conclusion')
          echo "tonight's skill evals: ${evals:-not run}"
          if [ "$open" -ge "$MAX_OPEN" ] || [ "$evals" = "failure" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "skipping tonight"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.queue.outputs.skip == 'false'
        with:
          path: cards

      - name: Pick an app
        if: steps.queue.outputs.skip == 'false'
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          # Files from an earlier night stay in this folder unless removed, and the issue
          # step would report an old night's error as tonight's.
          rm -rf card-kit work agent-home pick.json agent.log check.log test.log issue.md pr.md
          git clone -q --depth 1 https://github.com/Edgible/card-kit.git card-kit
          # Apps proposed before, as a pull request or an issue, open or closed, are not picked again.
          proposed=$( { gh pr list --repo "$GITHUB_REPOSITORY" --label agent-card --state all --limit 500 --json title --jq '.[].title'
                        gh issue list --repo "$GITHUB_REPOSITORY" --label agent-card --state all --limit 500 --json title --jq '.[].title'; } \
                      | sed -nE 's/^(New app card|App request): //p' | tr '\n' ' ')
          echo "proposed before: ${proposed:-none}"
          if [ -n "$APP" ]; then
            if ! [[ "$APP" =~ ^[A-Za-z0-9\ ._-]+$ ]]; then echo "app: a name, letters, digits, spaces, . _ -" >&2; exit 2; fi
            # The named app, and its needs-map category, so the merged card lands in the map.
            (cd cards && ../card-kit/run pick-app --app "$APP") > pick.json
          else
            (cd cards && ../card-kit/run pick-app --exclude $proposed) > pick.json || { echo "no gap left to fill"; echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          jq -r '"category: \(.category)\ncandidates: \([.candidates[].name] | join(", "))"' pick.json
          echo "none=false" >> "$GITHUB_OUTPUT"

      - name: Build and test the card
        if: steps.queue.outputs.skip == 'false' && steps.pick.outputs.none == 'false'
        id: build
        env:
          # The machine's own device (TEST_DEVICE in its runner's .env), else the repository variable.
          REPO_DEVICE: ${{ vars.TEST_DEVICE }}
        run: |
          set -euo pipefail
          DEVICE=${TEST_DEVICE:-$REPO_DEVICE}
          [ -n "$DEVICE" ] || { echo "set TEST_DEVICE in the runner's .env, or the repository variable TEST_DEVICE" >&2; exit 2; }
          # The agent's own home: the skill, and nothing else of this machine's.
          mkdir -p agent-home/.claude/skills work
          cp -R card-kit/skills/edgible-cards agent-home/.claude/skills/
          cp -R cards work/cards
          ln -s "$PWD/card-kit" work/card-kit
          docker_host=$(docker context inspect --format '{{.Endpoints.docker.Host}}')
          agent() {
            ( cd work/cards && env -i PATH="$PATH" HOME="$PWD/../../agent-home" LANG=en_US.UTF-8 \
                CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" DOCKER_HOST="$docker_host" \
                GH_TOKEN=disabled GITHUB_TOKEN=disabled GIT_CONFIG_NOSYSTEM=1 \
                claude -p "$1" --model sonnet --max-turns 80 \
                  --allowedTools Read Write Edit Glob Grep WebFetch Skill \
                    "Bash(../card-kit/run:*)" "Bash(docker manifest inspect:*)" "Bash(docker buildx imagetools inspect:*)" \
                  --disallowedTools "Bash(gh:*)" "Bash(git:*)" "Bash(curl:*)" "Bash(docker run:*)" "Bash(docker compose:*)" ) \
              > agent.log 2>&1 || true
            tail -c 3000 agent.log
          }
          picked=$(jq -c '{category, entry: (.entry // {} | {jobs, exposure, ask}), candidates}' pick.json)
          agent "Make one new Edgible app card, following the edgible-cards skill's \"Build an app card\" section and the card-kit README. You are in a checkout of Edgible/cards; card-kit is at ../card-kit.

          Choose ONE app from these candidates: the one that does the category's jobs best, not the most starred. Check that it has a maintained, multi-architecture (amd64 and arm64) container image with a version tag, using docker manifest inspect; skip any that does not. Candidates and the need they meet: $picked

          Write the card in a new top-level directory named for the app (lowercase, hyphens), with metadata.type: app, copying the shape of the closest existing app card. Mount only named volumes or paths under ./ : nothing on the host, no Docker socket, no privileged mode or host network. Choose each hostname's auth mode by who calls it, from the cards README's table. Write README.md with ../card-kit/run card-readme (write its notes as <name>-readme.yml at the repo root, not in the card directory), and check with ../card-kit/run check-cards --untrusted --before-test <name>/card.yml until it says ok. You cannot run the card or test-card here; the next step does.

          Write NEW-CARD.md at the repo root: the app's name and directory on the first line as 'card: <name>', then why you chose it over the other candidates, and each hostname's auth mode and why. Change nothing outside the new directory and NEW-CARD.md."
          # The new card is the one new top-level directory with a card.yml in it. NEW-CARD.md's
          # first line names it too, but an agent may write that line loosely ("card: Sync-in"),
          # so it decides only when there is not exactly one new directory.
          new=$(cd work/cards && git status --porcelain | sed -nE 's#^\?\? ([a-z0-9-]+)/$#\1#p' \
                | while read -r d; do [ -f "$d/card.yml" ] && echo "$d"; done || true)
          if [ "$(printf '%s\n' "$new" | grep -c . || true)" = 1 ]; then
            card=$new
          else
            card=$(sed -nE '1s/^card: *([A-Za-z0-9-]+).*/\1/p' work/cards/NEW-CARD.md 2>/dev/null | tr 'A-Z' 'a-z' || true)
          fi
          [ -n "$card" ] && [ -f "work/cards/$card/card.yml" ] || {
            echo "the agent made no card (new directories with a card.yml: ${new:-none})" | tee check.log
            echo "card=" >> "$GITHUB_OUTPUT"; echo "result=fail" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "card=$card" >> "$GITHUB_OUTPUT"
          # The agent may change only its own card and NEW-CARD.md.
          extra=$(cd work/cards && git status --porcelain | grep -vE "^\?\? ($card/|NEW-CARD\.md|[a-z0-9-]+-readme\.yml)$" || true)
          [ -z "$extra" ] || { echo "the agent changed files outside its card:"; echo "$extra"; echo "result=fail" >> "$GITHUB_OUTPUT"; exit 0; }
          result=fail
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "== attempt $attempt: check and test $card"
            if ! (cd work/cards && ../card-kit/run check-cards --untrusted --before-test "$card/card.yml") > check.log 2>&1; then
              cat check.log
              log=$(cat check.log)
            elif (cd work/cards && python3 ../card-kit/test-card.py "$card" --device "$DEVICE" --by agent) > test.log 2>&1; then
              tail -20 test.log; result=pass; break
            else
              tail -40 test.log
              log=$(tail -60 test.log)
            fi
            [ "$attempt" -lt "$ATTEMPTS" ] || break
            agent "The $card card you made did not pass. Fix the card, change nothing outside $card/, check it again with ../card-kit/run check-cards --untrusted --before-test $card/card.yml, and update NEW-CARD.md if the auth modes or app changed. What failed: $log"
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.build.outputs.result == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          CARD: ${{ steps.build.outputs.card }}
        run: |
          set -euo pipefail
          cd work/cards
          (../card-kit/run card-image "$CARD" || true) >/dev/null 2>&1
          ../card-kit/run check-cards --fresh --untrusted "$CARD/card.yml"
          branch="agent/$CARD"
          git checkout -q -b "$branch"
          git add "$CARD"
          git -c user.name="cards grow" -c user.email="actions@github.com" commit -q -m "New app card: $CARD

          Made by an agent with the edgible-cards skill and tested with test-card on a serving
          device, by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "HEAD:$branch"
          gh label create agent-card --repo "$GITHUB_REPOSITORY" --color 5319E7 --description "Made by the nightly grow job" 2>/dev/null || true
          {
            echo "## What"
            echo
            echo "A new app card, \`$CARD\`, made by the nightly grow job for the first gap in the needs map. **An AI agent made this pull request.** Review it with the checklist below before merging."
            echo
            echo "Category: $(jq -r '.category // "asked for by hand"' ../../pick.json)"
            echo
            tail -n +2 NEW-CARD.md
            echo
            echo "## Test"
            echo
            echo '```'
            sed -n '/^result:/,$p' ../../test.log | head -20 | sed -e "s#$HOME#~#g"
            echo '```'
            echo
            echo "## Review"
            echo
            echo "- [ ] Default passwords are changed or generated, and the README says how to sign in the first time."
            echo "- [ ] Every secret is empty in git, with a \`# Generate with:\` comment."
            echo "- [ ] The auth mode of each hostname suits its callers, by the README's table."
            echo "- [ ] The README says where the data lives, and Tear down backs it up before deleting it."
            echo "- [ ] The app is a sensible choice for its category, and its image is from its own project."
            echo "- [ ] Nothing names a device, a hostname, or an organization."
            echo "- [x] \`test.yml\` passes and \`check-cards --fresh --untrusted\` passes (checked by the workflow)."
            echo
            echo "After this is merged, the grow job adds \`$CARD\` to its category in card-kit's needs map. Made by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          } > ../../pr.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "New app card: $CARD" --label agent-card --body-file ../../pr.md

      - name: Open an issue instead
        if: steps.build.outputs.result == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
          CARD: ${{ steps.build.outputs.card }}
        run: |
          set -euo pipefail
          gh label create agent-card --repo "$GITHUB_REPOSITORY" --color 5319E7 --description "Made by the nightly grow job" 2>/dev/null || true
          name=${CARD:-$(jq -r '.candidates[0].name' pick.json)}
          {
            echo "The nightly grow job tried to make an app card for **$name** (category: $(jq -r '.category // "asked for by hand"' pick.json)) and could not make one that passes."
            echo
            echo "Offered: $(jq -r '[.candidates[].name] | join(", ")' pick.json)."
            echo
            [ -f work/cards/NEW-CARD.md ] && { echo "## The agent's notes"; echo; tail -n +2 work/cards/NEW-CARD.md; echo; }
            echo "## Where it stopped"
            echo
            echo '```'
            { [ -f test.log ] && tail -40 test.log; [ -f check.log ] && cat check.log; [ -f test.log ] || [ -f check.log ] || tail -c 2000 agent.log; } | sed -e "s#$HOME#~#g"
            echo '```'
            echo
            echo "A person can pick this up, or close it. It will not be picked again. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "App request: $name" --label app-request --label agent-card --body-file issue.md

      - name: Clean up
        if: always()
        run: rm -rf work agent-home card-kit agent.log check.log test.log
