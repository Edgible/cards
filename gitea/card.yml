apiVersion: v1
kind: Card
metadata:
  name: gitea
  description: Gitea, your own Git forge, with Git over HTTPS and SSH
  type: app

applications:
  - name: gitea
    what: Gitea web, API, and Git over HTTPS
    from: gitea/gitea:28.1.0
    database: postgres:17.11-alpine
    port: 3003
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: gitea

  - name: gitea-ssh
    what: Git over SSH, same process as gitea
    from: gitea/gitea:28.1.0
    port: 22222
    protocol: tcp
    subtype: existing
    published: true
    authModes: [none]
    place: gitea

places:
  gitea:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
